<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoneAge — Return of the Heroes</title>
<style>
  /* 4:3 的画面按窗口大小等比缩放（放大、缩小都跟着窗口），永远完整显示、不出现卷轴 */
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #e8e8ea; font: 14px system-ui, sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; width: min(100vw, calc(100vh * 4 / 3)); width: min(100vw, calc(100dvh * 4 / 3)); }
  /* 两张画布的像素数由脚本跟着显示大小设定（ui.ts fitView / fitOverlay），一般不会再被浏览器缩放 */
  .stage canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  /* ?debug 的数据：独立一层盖在画面上面，自带深色底，不会被游戏的字和图盖住 */
  #hud { position: fixed; left: 4px; bottom: 2px; z-index: 10; color: #d0d2da; font-size: 12px; line-height: 16px; white-space: pre;
    background: rgba(0, 0, 0, 0.72); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
  #hud:empty { display: none; }
  /* Desktop rules above are deliberately unchanged. Only the mobile mode owns these hosts. */
  #mobile-root { display: none; }
  html.sa-mobile #mobile-root {
    display: flex; flex-direction: column; position: fixed; inset: 0 auto auto 0;
    width: 100vw; height: 100dvh; box-sizing: border-box; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #29443e 0%, #102a29 50%, #081b1c 100%);
  }
  html.sa-mobile #mobile-viewport {
    position: relative; flex: none; width: var(--game-width, 100vw); height: var(--game-height, 75vw);
    min-height: 0; overflow: hidden; touch-action: none; isolation: isolate; background: #000;
  }
  html.sa-mobile #mobile-chrome { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: auto; z-index: 2; touch-action: pan-y; }
  html.sa-mobile #mobile-root[data-orientation='landscape'] #mobile-viewport {
    position: absolute; left: var(--game-left); top: var(--game-top);
  }
  html.sa-mobile #mobile-root[data-orientation='landscape'] #mobile-chrome {
    position: absolute; inset: 0; overflow: visible; pointer-events: none;
  }
  html.sa-mobile #mobile-viewport > .stage {
    position: absolute; width: 800px; height: 600px; left: var(--mobile-left, 50%); top: var(--mobile-top, 0px);
    transform: translateX(-50%) scale(var(--mobile-scale, .85)); transform-origin: center top;
  }
  html.sa-mobile #view { touch-action: none; user-select: none; -webkit-user-select: none; }
  html.sa-mobile input { font-size: 16px; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="view" width="800" height="600"></canvas>
  <canvas id="overlay" width="800" height="600"></canvas>
</div>
<div id="mobile-root"><div id="mobile-viewport"></div><div id="mobile-chrome"></div></div>
<div id="hud"></div>
<script type="module" src="dist/main.js?v=08f6b4cf8a3cf7f0"></script>
</body>
</html>
